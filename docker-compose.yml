services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vada
      POSTGRES_PASSWORD: vada
      POSTGRES_DB: vada9598
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vada -d vada9598"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vada:vada@postgres:5432/vada9598
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
